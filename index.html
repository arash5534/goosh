<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="گوش">
<meta name="application-name" content="گوش">
<meta name="theme-color" content="#0b0b0c">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/goosh-180.png" sizes="180x180">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/goosh-192.png" sizes="192x192" type="image/png">
<title>گوش مصنوعی</title>
<style id="gl-style">
html,body{margin:0;background:#0b0b0c;color:#f2f2f2;font-family:-apple-system,"SF Pro Text",Tahoma,sans-serif}
#gl{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
#gl .box{width:100%;max-width:340px;text-align:center}
#gl h1{font-size:20px;margin:10px 0 4px}
#gl p{color:#9a9aa0;font-size:14px;margin:4px 0 16px}
#gl input[type=password]{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #333;background:#16161a;color:#fff;font-size:18px;text-align:center;direction:ltr}
#gl button{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:#2f6fed;color:#fff;font-size:17px;font-weight:600}
#gl button:disabled{opacity:.6}
#gl label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:14px;color:#c8c8cc}
#gl .err{color:#ff6b6b;min-height:22px;margin-top:10px;font-size:14px}
#gl .ver{color:#55555b;font-size:12px;margin-top:22px;direction:ltr}
</style>
</head>
<body>
<div id="gl"><form class="box" id="gl-form" autocomplete="on">
  <div style="font-size:48px">🔐</div>
  <h1>گوش مصنوعی</h1>
  <p>برنامه رمزگذاری شده است. برای باز کردن، رمز صاحب برنامه را وارد کنید.</p>
  <input type="text" name="username" value="goosh" autocomplete="username" style="display:none" readonly>
  <input type="password" id="gl-pw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" placeholder="رمز" required>
  <label><input type="checkbox" id="gl-rem" checked> روی این دستگاه به خاطر بسپار</label>
  <button id="gl-btn" type="submit">باز کردن</button>
  <div class="err" id="gl-err"></div>
  <div class="ver">v1.9.1 (goosh-v17)</div>
</form></div>
<script>
// Owner lock: the app's code (HTML, CSS, JS) is published only as AES-256-GCM ciphertext (app.enc).
// The key is derived on the device from the owner's password with PBKDF2-SHA256; nothing secret is stored on the server.
// "Remember" keeps the derived key as a NON-extractable CryptoKey in this browser's IndexedDB (the password itself is never stored).
(function () {
  var ENC = 'app.enc?v=1.9.1', $ = function (id) { return document.getElementById(id); };
  function idb(mode, fn) { return new Promise(function (res, rej) { var r = indexedDB.open('goosh-lock', 1); r.onupgradeneeded = function () { r.result.createObjectStore('k'); };
    r.onsuccess = function () { var t = r.result.transaction('k', mode), q = fn(t.objectStore('k')); t.oncomplete = function () { res(q && q.result); }; t.onerror = function () { rej(t.error); }; }; r.onerror = function () { rej(r.error); }; }); }
  var encP = null;
  function getEnc() { return encP || (encP = fetch(ENC, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); }).then(function (b) {
    var u = new Uint8Array(b), magic = String.fromCharCode.apply(null, u.subarray(0, 6)); if (magic !== 'GOOSH1') throw new Error('bad file');
    var dv = new DataView(b); return { salt: u.slice(6, 22), iter: dv.getUint32(22), iv: u.slice(26, 38), ct: u.slice(38) }; }).catch(function (e) { encP = null; throw e; })); }
  // iOS may auto-capitalize / swap digits or dashes: the password is lowercase ASCII, so normalize before deriving.
  function normPw(pw) { var s = String(pw || ''); try { s = s.normalize('NFKC'); } catch (e) { }
    s = s.toLowerCase().replace(/[\u06f0-\u06f9]/g, function (c) { return String(c.charCodeAt(0) - 0x06f0); })
      .replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
      .replace(/[\u2010-\u2015\u2212\u2043\ufe58\ufe63\uff0d\u058a\u05be\u1806\u2e3a\u2e3b]/g, '-');
    var m = s.match(/[a-z0-9]{4}(?:-[a-z0-9]{4}){3}/);   // pasted chat text, quotes, backticks, RTL marks, zero-width chars around it
    return m ? m[0] : s.replace(/[^a-z0-9-]/g, ''); }
  function derive(pw, e) { return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: e.salt, iterations: e.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); }); }
  function run(key, e, onOk) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: e.iv }, key, e.ct).then(function (plain) {
    return Promise.resolve(onOk && onOk()).then(function () { return plain; }); }).then(function (plain) {
    var B = JSON.parse(new TextDecoder().decode(plain)), mods = {};
    Object.keys(B.modules).forEach(function (n) { mods[n] = URL.createObjectURL(new Blob([B.modules[n]], { type: 'text/javascript' })); });
    window.__gooshMods = mods; window.__gooshLocked = true;
    $('gl-style').remove(); var st = document.createElement('style'); st.textContent = B.css; document.head.appendChild(st);
    document.body.innerHTML = B.body;
    return import(mods['app.js']).catch(function (x) { document.body.insertAdjacentHTML('afterbegin', '<div style="padding:16px;color:#ff6b6b">خطا در اجرای برنامه: ' + String(x && x.message).replace(/</g, '&lt;') + '</div>'); throw x; });
  }); }
  function fail(msg) { if (!$('gl-err')) { console.error(msg); return; } $('gl-err').textContent = msg; $('gl-btn').disabled = false; $('gl-pw').disabled = false; }
  function show() { $('gl').style.display = ''; setTimeout(function () { try { $('gl-pw').focus(); } catch (x) { } }, 50); }
  $('gl').style.display = 'none';
  // try the remembered key first
  Promise.all([idb('readonly', function (s) { return s.get('key'); }).catch(function () { return null; }), getEnc()]).then(function (a) {
    if (!a[0]) return show();
    return run(a[0], a[1]).catch(function () { idb('readwrite', function (s) { return s.delete('key'); }).catch(function () { }); show(); });
  }).catch(function (e) { show(); fail('فایل برنامه دریافت نشد (' + (e && e.message) + '). اینترنت را بررسی کنید.'); });
  $('gl-form').addEventListener('submit', function (ev) {
    ev.preventDefault(); var pw = normPw($('gl-pw').value); if (!pw) return;
    $('gl-btn').disabled = true; $('gl-pw').disabled = true; $('gl-err').textContent = 'در حال باز کردن…';
    getEnc().then(function (e) { return derive(pw.trim(), e).then(function (key) {
      return run(key, e, function () { return $('gl-rem').checked ? idb('readwrite', function (s) { return s.put(key, 'key'); }).catch(function () { }) : null; }); }); })
      .catch(function (err) { $('gl-pw').value = ''; fail(err && (err.name === 'OperationError' || err.message === 'WRONG') ? 'رمز اشتباه است.' : 'باز کردن ممکن نشد: ' + (err && (err.name + ': ' + err.message))); });
  });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () { }); } catch (x) { } }
})();
</script>
</body>
</html>
