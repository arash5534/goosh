<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0c;color:#fff;font-family:-apple-system,Tahoma,sans-serif;text-align:center">
<div><div style="font-size:42px">🔄</div><div id="m">در حال دریافت آخرین نسخهٔ «گوش مصنوعی»…</div>
<div style="font-size:13px;opacity:.7;margin-top:8px">یادداشت‌ها و اطلاعات شما پاک نمی‌شود.</div>
<a href="../" style="color:#9cf;display:inline-block;margin-top:16px">اگر خودکار باز نشد، اینجا بزنید</a></div>
<script>
// Reset page: this URL was never cached by older builds, so it always loads fresh from the network.
// It removes old service workers + caches (NOT IndexedDB data) and opens the app again.
(async function () {
  try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function (r) { return r.unregister(); })); } } catch (e) { }
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(function (k) { return k.indexOf('goosh-tts') !== 0; }).map(function (k) { return caches.delete(k); })); } } catch (e) { }
  location.replace('../?v=' + Date.now());
})();
</script>
</body>
</html>
